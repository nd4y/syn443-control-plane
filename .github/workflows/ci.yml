  invitations:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: true
      - run: bash -n tools/test_invitations.sh
      - name: Run complete invitation and provisioning race suites with country evidence
        run: |
          set -euo pipefail
          GOFLAGS=-json bash tools/test_invitations.sh | tee exit-country-postgres-tests.jsonl
          jq -es 'map(select(.Package == "github.com/nd4y/syn443-control-plane/internal/invitation" and .Action == "pass")) | map(.Test) | contains(["TestSQLIssueLostReplyAndConflictingOperations","TestSQLClaimSeatQuotaKeySubstitutionAndStatusBoundaries","TestSQLRevokedUncompletedDeviceReleasesItsSeatBeforeExpiry"])' exit-country-postgres-tests.jsonl
          python3 tools/check_exit_country_evidence.py exit-country-postgres-tests.jsonl --stage postgres
          python3 tools/check_adaptive_runtime_evidence.py exit-country-postgres-tests.jsonl --stage postgres
          python3 tools/check_operation_reconcile_evidence.py exit-country-postgres-tests.jsonl --stage provisioning
          python3 tools/check_operation_version_evidence.py exit-country-postgres-tests.jsonl --stage provisioning
          python3 tools/check_check_plan_evidence.py exit-country-postgres-tests.jsonl --stage postgres
          jq -es '[.[] | select(.Package == "github.com/nd4y/syn443-control-plane/internal/deviceprovisioning" and .Test == "TestSQLRemnawaveAndTwoIndependentFeedsPublishOneBoundPolicy" and .Action != "output") | .Action] == ["run", "pass"]' exit-country-postgres-tests.jsonl
          jq -es 'any(.[]; .Package == "github.com/nd4y/syn443-control-plane/internal/deviceprovisioning" and .Action == "pass" and .Test == "TestSQLNetworkAuthorityIssuesOnlyNegotiatedHTTPSStatus")' exit-country-postgres-tests.jsonl
      - run: python3 tools/check_invitation_coverage.py
      - name: Scan invitation evidence
        id: invitation-scan
        if: always()
        run: |
          if test -f exit-country-postgres-tests.jsonl; then
            test -s exit-country-postgres-tests.jsonl
            python3 tools/check_public_data.py exit-country-postgres-tests.jsonl
            bash tools/scan_secrets.sh exit-country-postgres-tests.jsonl
          fi
          test -s invitation-coverage.out
          test -s provisioning-coverage.out
          python3 tools/check_public_data.py invitation-coverage.out provisioning-coverage.out
          bash tools/scan_secrets.sh invitation-coverage.out provisioning-coverage.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.invitation-scan.outcome == 'success'
        with:
          name: invitation-test-evidence
          path: |
            invitation-coverage.out
            provisioning-coverage.out
            exit-country-postgres-tests.jsonl
          if-no-files-found: error
          retention-days: 14
  enrollment:
    needs: go
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: control-plane-linux-amd64
          path: ${{ runner.temp }}/control-plane-release
      - name: Package the scanned overlay worker for the SQL fixture
        run: |
          bash -n tools/test_enrollment.sh tools/package_overlay_worker.sh
          bash tools/package_overlay_worker.sh "$RUNNER_TEMP/control-plane-release" "$RUNNER_TEMP/overlay-worker-image"
          install -Dm0555 "$RUNNER_TEMP/control-plane-release/telemetry-ingest" bin/telemetry-ingest
          echo "SYN443_TEST_OVERLAY_IMAGE=syn443-overlay-worker:$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Capture and require PostgreSQL refresh-boundary outcomes
        run: |
          set -euo pipefail
          GOFLAGS=-json bash tools/test_enrollment.sh | tee session-boundary-postgres-tests.jsonl
          jq -es 'any(.[]; .Package == "github.com/nd4y/syn443-control-plane/internal/enrollment" and .Test == "TestActualManagedAPIPublisherAndProviderWorkerProcesses/readiness_preserves_pending_provider_work/container_role_checks" and .Action == "pass")' session-boundary-postgres-tests.jsonl
          python3 tools/check_session_boundary_evidence.py session-boundary-postgres-tests.jsonl
          jq -es 'map(select(.Package == "github.com/nd4y/syn443-control-plane/internal/enrollment" and .Action == "pass")) | map(.Test) | contains(["TestStandaloneTelemetryProcessReceivesBoundEvents","TestStandaloneTelemetryRejectsPrivilegeDrift"])' session-boundary-postgres-tests.jsonl
          jq -es 'map(select(.Package == "github.com/nd4y/syn443-control-plane/internal/enrollment" and .Action == "pass")) | map(.Test) | contains(["TestTelemetryPressurePreservesPolicyAndRefresh","TestTelemetryAddressBudgetLeavesPolicyAccessible"])' session-boundary-postgres-tests.jsonl
          jq -es 'map(select(.Package == "github.com/nd4y/syn443-control-plane/internal/enrollment" and .Action == "pass")) | map(.Test) | contains(["TestOperatorPolicyTimingBoundsAndLegacyGrantHash","TestSQLGrantTimingFencesPublisherAndSchedulesSignedRenewal"])' session-boundary-postgres-tests.jsonl
          jq -es 'map(select(.Package == "github.com/nd4y/syn443-control-plane/internal/enrollment" and .Action == "pass")) | map(.Test) | contains(["TestTelemetryWorkerRecoversRetainedGapsAndWrapsAfterBusyHour","TestTelemetryAggregateWorkerProcessCommitsStopsAndResumes"])' session-boundary-postgres-tests.jsonl
          jq -es 'map(select(.Package == "github.com/nd4y/syn443-control-plane/internal/enrollment" and .Action == "pass")) | map(.Test) | contains(["TestTelemetryAnalysisProcessRequiresVerifiedPostgresTLS/trusted_name","TestTelemetryAnalysisProcessRequiresVerifiedPostgresTLS/wrong_name","TestTelemetryAnalysisProcessRequiresVerifiedPostgresTLS/unknown_ca"])' session-boundary-postgres-tests.jsonl
      - name: Check and scan enrollment evidence
        id: enrollment-scan
        run: |
          python3 tools/check_enrollment_coverage.py enrollment-coverage.out
          python3 tools/check_public_data.py enrollment-coverage.out session-boundary-postgres-tests.jsonl
          bash tools/scan_secrets.sh enrollment-coverage.out session-boundary-postgres-tests.jsonl
      - name: Verify and scan the tested container archive
        run: |
          cd "$RUNNER_TEMP/overlay-worker-image"
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          python3 tools/check_public_data.py "$RUNNER_TEMP/overlay-worker-image"
          bash tools/scan_secrets.sh "$RUNNER_TEMP/overlay-worker-image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: overlay-worker-image-linux-amd64
          path: ${{ runner.temp }}/overlay-worker-image/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.enrollment-scan.outcome == 'success'
        with:
          name: enrollment-test-evidence
          path: |
            enrollment-coverage.out
            session-boundary-postgres-tests.jsonl
          retention-days: 14
