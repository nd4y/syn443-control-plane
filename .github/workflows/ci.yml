name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m unittest discover -s tools -p 'test_public_data.py'
      - run: python3 tools/check_public_data.py --history
      - run: bash tools/scan_secrets.sh
  documents:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 tools/check_documents.py
      - run: python3 tools/check_contracts.py
  go:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: true
      - run: test -z "$(gofmt -l cmd internal contracts integration)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: python3 tools/check_coverage.py
      - run: go test ./internal/decision -run '^$' -fuzz '^FuzzDecode$' -fuzztime=15s -parallel=2
      - run: go test ./internal/policy -run '^$' -fuzz '^FuzzPolicyDecode$' -fuzztime=15s -parallel=2
      - run: go test ./internal/identity -run '^$' -fuzz '^FuzzIdentityDecode$' -fuzztime=15s -parallel=2
      - run: go build -o bin/syn443-api ./cmd/api
      - run: python3 tools/smoke_api.py bin/syn443-api
      - run: go build -o bin/syn443-policy-sign ./cmd/policy-sign && go build -o bin/syn443-policy-serve ./cmd/policy-serve
      - run: python3 tools/smoke_policy.py bin/syn443-policy-serve bin/syn443-policy-sign
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build control-plane runtime artifacts
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/control-plane
          for binary in enrollment-api enrollment-worker enrollment-admin support-chat-web; do
            go build -trimpath -ldflags='-s -w -buildid=' -o "dist/control-plane/$binary" "./cmd/$binary"
          done
          git rev-parse HEAD > dist/control-plane/SOURCE.txt
          (cd dist/control-plane && sha256sum enrollment-api enrollment-worker enrollment-admin support-chat-web > SHA256SUMS)
      - name: Scan control-plane runtime payloads
        id: runtime-scan
        run: |
          python3 tools/check_public_data.py dist/control-plane
          bash tools/scan_secrets.sh dist/control-plane
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.runtime-scan.outcome == 'success'
        with:
          name: control-plane-linux-amd64
          path: dist/control-plane/
          if-no-files-found: error
          retention-days: 14
      - name: Workflow validation
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Dependency inventory
        run: go list -m -json all > dependency-inventory.json
      - name: Scan evidence payloads
        id: evidence-scan
        if: always()
        run: |
          test -s coverage.out && test -s dependency-inventory.json
          python3 tools/check_public_data.py coverage.out dependency-inventory.json
          bash tools/scan_secrets.sh coverage.out dependency-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence-upload
        if: always() && steps.evidence-scan.outcome == 'success'
        with:
          name: control-plane-test-evidence
          path: |
            coverage.out
            dependency-inventory.json
          retention-days: 14
  keycloak:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: true
      - run: bash -n tools/test_keycloak.sh
      - run: bash tools/test_keycloak.sh
  support-web:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web-tests
      - run: npx playwright install --with-deps chromium
        working-directory: web-tests
      - run: npm test
        working-directory: web-tests
      - name: Scan synthetic browser evidence
        id: web-scan
        if: always()
        run: |
          test -s web-tests/results.xml
          python3 tools/check_public_data.py web-tests/results.xml
          bash tools/scan_secrets.sh web-tests/results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.web-scan.outcome == 'success'
        with:
          name: support-web-test-evidence
          path: web-tests/results.xml
          retention-days: 14
  enrollment:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: true
      - run: bash -n tools/test_enrollment.sh
      - run: bash tools/test_enrollment.sh
      - name: Check and scan enrollment evidence
        id: enrollment-scan
        run: |
          python3 tools/check_enrollment_coverage.py enrollment-coverage.out
          python3 tools/check_public_data.py enrollment-coverage.out
          bash tools/scan_secrets.sh enrollment-coverage.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.enrollment-scan.outcome == 'success'
        with:
          name: enrollment-test-evidence
          path: enrollment-coverage.out
          retention-days: 14
