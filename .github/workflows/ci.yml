name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  public-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m unittest discover -s tools -p 'test_public_data.py'
      - run: python3 tools/check_public_data.py --history
      - run: bash tools/scan_secrets.sh
  documents:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 tools/check_documents.py
      - id: android_register
        run: |
          revision=$(cat docs/android-register-revision.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nd4y/syn443-android
          ref: ${{ steps.android_register.outputs.revision }}
          path: .android-register
          sparse-checkout: /docs/requirements-register.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: python3 -m unittest discover -s tools -p 'test_product_requirements.py'
      - run: python3 -m unittest discover -s tools -p 'test_overlay_image.py'
      - run: python3 tools/product_requirements.py .android-register/docs/requirements-register.json --csv "${RUNNER_TEMP}/product-requirements.csv"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-requirements
          path: ${{ runner.temp }}/product-requirements.csv
          if-no-files-found: error
      - run: python3 tools/check_contracts.py
      - run: python3 -m unittest discover -s tools -p 'test_enrollment_site.py'
      - run: python3 -m unittest discover -s tools -p 'test_exit_country_evidence.py'
      - run: python3 -m unittest discover -s tools -p 'test_adaptive_runtime_evidence.py'
      - run: python3 -m unittest discover -s tools -p 'test_route_fixture_evidence.py'
      - run: python3 -m unittest discover -s tools -p 'test_admin_bootstrap_evidence.py'
      - run: python3 -m unittest discover -s tools -p 'test_enrollment_queue_evidence.py'
      - run: python3 -m unittest discover -s tools -p 'test_service_discovery_evidence.py'
      - run: python3 -m unittest discover -s tools -p 'test_operation_reconcile_evidence.py'
      - run: python3 -m unittest discover -s tools -p 'test_operation_version_evidence.py'
      - run: python3 -m unittest discover -s tools -p 'test_session_boundary_evidence.py'
      - run: python3 -m unittest discover -s tools -p 'test_grant_fingerprint_evidence.py'
      - run: python3 -m unittest discover -s tools -p 'test_check_plan_evidence.py'
      - run: python3 -m unittest discover -s tools -p 'test_secret_findings_summary.py'
  go:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: console-ui/package-lock.json
      - name: Bundle the PatternFly control console
        run: |
          npm ci --ignore-scripts
          npm run build
        working-directory: console-ui
      - run: test -z "$(gofmt -l cmd internal contracts integration)"
      - run: go mod verify
      - run: go vet ./...
      - name: Run complete race suite with actual country outcome evidence
        run: |
          set -euo pipefail
          go test -race -count=1 -json -coverprofile=coverage.out ./... | tee exit-country-core-tests.jsonl
          python3 tools/check_exit_country_evidence.py exit-country-core-tests.jsonl --stage core
          jq -es 'any(.[]; .Package == "github.com/nd4y/syn443-control-plane/internal/chatweb" and .Test == "TestConsoleResourceEditsKeepCredentialsAndRequireReviewedExistingRevision" and .Action == "pass")' exit-country-core-tests.jsonl
          python3 tools/check_adaptive_runtime_evidence.py exit-country-core-tests.jsonl --stage core
          python3 tools/check_route_fixture_evidence.py exit-country-core-tests.jsonl
          jq -es 'map(select(.Package == "github.com/nd4y/syn443-control-plane/internal/chatweb" and .Test == "TestConsoleProfileValidationUsesCanonicalGatesWithoutProbing" and .Action == "pass")) | length == 1' exit-country-core-tests.jsonl
          jq -es 'map(select(.Package == "github.com/nd4y/syn443-control-plane/internal/chatweb" and .Test == "TestConsoleInvitationActionsAreBoundedAndSeparateFromImport" and .Action == "pass")) | length == 1' exit-country-core-tests.jsonl
          python3 tools/check_admin_bootstrap_evidence.py exit-country-core-tests.jsonl
          python3 tools/check_enrollment_queue_evidence.py exit-country-core-tests.jsonl
          jq -es 'map(select(.Package == "github.com/nd4y/syn443-control-plane/cmd/enrollment-admin" and .Action == "pass")) | map(.Test) | contains(["TestTelemetryAggregateWorkerRotatesAfterFailureAndStopsWithoutAnotherStep","TestTelemetryAggregateWorkerRequiresScopedDSNAndExactArguments"])' exit-country-core-tests.jsonl
          python3 tools/check_service_discovery_evidence.py exit-country-core-tests.jsonl
          python3 tools/check_grant_fingerprint_evidence.py exit-country-core-tests.jsonl
          python3 tools/check_operation_version_evidence.py exit-country-core-tests.jsonl --stage core
          python3 tools/check_check_plan_evidence.py exit-country-core-tests.jsonl --stage core
      - name: Require actual ordinary signed-service discovery outcomes
        run: |
          set -euo pipefail
          go test -count=1 -json ./internal/bootstrap ./cmd/enrollment-api -run '^TestServiceDiscovery' | tee service-discovery-ordinary-tests.jsonl
          python3 tools/check_service_discovery_evidence.py service-discovery-ordinary-tests.jsonl
      - name: Require actual adaptive catalogue snapshot outcomes
        run: |
          set -euo pipefail
          go test -race -count=1 -json ./internal/configuration -run '^TestAdaptiveSnapshot' | tee adaptive-catalogue-tests.jsonl
          python3 tools/check_adaptive_snapshot_evidence.py adaptive-catalogue-tests.jsonl
          python3 tools/check_public_data.py adaptive-catalogue-tests.jsonl
          bash tools/scan_secrets.sh adaptive-catalogue-tests.jsonl
      - run: python3 tools/check_coverage.py
      - run: go test ./internal/decision -run '^$' -fuzz '^FuzzDecode$' -fuzztime=15s -parallel=2
      - run: go test ./internal/routegraph -run '^$' -fuzz '^FuzzRouteGraphDecode$' -fuzztime=15s -parallel=2
      - run: go test ./internal/policy -run '^$' -fuzz '^FuzzPolicyDecode$' -fuzztime=15s -parallel=2
      - run: go test ./internal/identity -run '^$' -fuzz '^FuzzIdentityDecode$' -fuzztime=15s -parallel=2
      - run: go test ./internal/enrollment -run '^$' -fuzz '^FuzzRuntimeObservation$' -fuzztime=15s -parallel=2
      - run: go test ./internal/remnawave -run '^$' -fuzz '^FuzzProviderJSON$' -fuzztime=15s -parallel=2
      - run: go test ./internal/subscriptions -run '^$' -fuzz '^FuzzSubscriptionJSON$' -fuzztime=15s -parallel=2
      - run: go test ./internal/configuration -run '^$' -fuzz '^FuzzConfigurationGraph$' -fuzztime=15s -parallel=2
      - run: go test ./internal/overlay -run '^$' -fuzz '^FuzzAddressedCredential$' -fuzztime=15s -parallel=2
      - run: go test ./internal/configuration -run '^$' -fuzz '^FuzzConfigurationLayers$' -fuzztime=15s -parallel=2
      - run: go test ./internal/configuration -run '^$' -fuzz '^FuzzNetworkPlan$' -fuzztime=15s -parallel=2
      - run: go test ./internal/bootstrap -run '^$' -fuzz '^FuzzInvitationLink$' -fuzztime=15s -parallel=2
      - name: Generate public Go to Kotlin bootstrap evidence
        run: |
          mkdir -p dist/bootstrap-wire
          go run ./cmd/bootstrap-fixture > dist/bootstrap-wire/bootstrap-wire-vectors.json
          test -s dist/bootstrap-wire/bootstrap-wire-vectors.json
          python3 tools/check_public_data.py dist/bootstrap-wire
          bash tools/scan_secrets.sh dist/bootstrap-wire
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-wire-evidence
          path: dist/bootstrap-wire/bootstrap-wire-vectors.json
          if-no-files-found: error
          retention-days: 14
      - name: Require, generate and scan actual Go global-layer wire evidence
        id: layer-wire-scan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re
          package = 'github.com/nd4y/syn443-control-plane/cmd/layer-fixture'
          required = {
              'TestLayerFixturePublisherHashFormulaAndMarshalSiteRemainSourceBound',
              'TestLayerFixtureRawMessagesRetainOrderLexemesAndGoEscaping',
              'TestLayerFixtureGenericReencodingCannotReplaceAuthoritativeLayerBytes',
              'TestLayerFixtureEveryScenarioCompilesAndPreservesUneditedParents',
              'TestLayerFixtureDeterministicBoundedActionsOutputContainsOnlySyntheticData',
              'TestLayerFixtureRefusesUnownedExecutionAndFailedWrites',
              'TestLayerProjectionActualMergeHashAndPermutationMatchEveryVector',
              'TestLayerProjectionContainersOriginsGroupsAndPermissionOnlyChangesAreObservable',
              'TestLayerProjectionNullDeleteInheritLexicalNumbersAndUnicodeStayDistinct',
              'TestLayerProjectionRebaseChosenLayersAreExplicitAndCurrentRestrictionsStillApply',
              'TestLayerProjectionActual4096LeafBoundaryIsSummarizedWithoutLargePayload',
              'TestLayerProjectionDeterministicActionsOutputAndFailureGuardsStayBounded',
              'TestLayerProjectionOracleRemainsBoundToActualDecodeMergeAndMarshal',
              'TestOperationFixtureActualEnvelopeBytesHashesAndDerivedJobIDsAreSourceBound',
              'TestOperationFixtureEightMutationOriginalsUseActualClosedServerSchemas',
              'TestOperationFixtureEveryOutcomeUsesActualDTOAndCorrectOptionalJobShape',
              'TestOperationFixtureEphemeralPreviewTicketsVerifyOnlyWithPublicSyntheticRoot',
              'TestOperationFixturePublishBodiesRetainExactProposalAndPreviewContext',
              'TestOperationFixtureBoundedActionsOutputPreservesExistingModesAndRejectsFailedWrites',
          }
          source = '\n'.join(Path(path).read_text(encoding='utf-8') for path in ('cmd/layer-fixture/main_test.go', 'cmd/layer-fixture/operations_test.go'))
          names = re.findall(r'^func (Test[A-Za-z0-9_]+)\(t \*testing\.T\) \{', source, re.M)
          assert len(names) == len(set(names)) and set(names) == required, 'Layer fixture source gate mismatch'
          evidence = Path('exit-country-core-tests.jsonl')
          assert evidence.is_file() and 0 < evidence.stat().st_size <= 64*1024*1024, 'Missing bounded actual Go outcomes'
          states = {name: [] for name in required}
          completed = []
          for line in evidence.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              assert isinstance(row, dict), 'Invalid Go outcome'
              if row.get('Package') != package:
                  continue
              action, name = row.get('Action'), row.get('Test')
              assert action not in ('fail', 'skip'), 'Failed or skipped layer fixture outcome'
              if name is not None and action in ('run', 'pass'):
                  assert name in required and not completed, 'Unknown or late layer fixture outcome'
                  states[name].append(action)
              elif name is None and action == 'pass':
                  assert all(value == ['run', 'pass'] for value in states.values()), 'Incomplete layer fixture package'
                  completed.append(action)
          assert completed == ['pass'] and all(value == ['run', 'pass'] for value in states.values()), 'Missing or repeated layer fixture outcome'
          print('19 actual source-bound layer wire/projection/operation fixture cases passed')
          PY
          mkdir -p dist/layer-wire
          go run ./cmd/layer-fixture > dist/layer-wire/fixture.json
          test -s dist/layer-wire/fixture.json
          git rev-parse HEAD > dist/layer-wire/SOURCE.txt
          (cd dist/layer-wire && sha256sum fixture.json SOURCE.txt > SHA256SUMS)
          python3 tools/check_public_data.py dist/layer-wire
          bash tools/scan_secrets.sh dist/layer-wire
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.layer-wire-scan.outcome == 'success'
        with:
          name: layer-wire-evidence
          path: dist/layer-wire/
          if-no-files-found: error
          retention-days: 14
      - name: Generate and scan separate actual Go projection conformance evidence
        id: layer-projection-scan
        run: |
          set -euo pipefail
          mkdir -p dist/layer-projection
          go run ./cmd/layer-fixture --projection > dist/layer-projection/projection-fixture.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          def closed_object(pairs):
              value = {}
              for key, item in pairs:
                  assert key not in value, 'Duplicate projection artifact field'
                  value[key] = item
              return value
          def parse(raw):
              return json.loads(raw, object_pairs_hook=closed_object, parse_constant=lambda _: (_ for _ in ()).throw(ValueError('Non-finite fixture value')))
          def records(value, keys, count=None):
              assert isinstance(value, list) and (count is None or len(value) == count)
              seen = set()
              for item in value:
                  assert isinstance(item, dict) and set(item) == keys
                  name = item['name']
                  assert isinstance(name, str) and 0 < len(name) <= 128 and name not in seen
                  seen.add(name)
              return seen
          raw = Path('dist/layer-projection/projection-fixture.json').read_bytes()
          assert 0 < len(raw) <= 65536, 'Projection artifact byte bound'
          doc = parse(raw.decode('utf-8'))
          assert set(doc) == {'schemaVersion', 'hashAlgorithm', 'layers', 'projections', 'rebases', 'bounds'}
          assert type(doc['schemaVersion']) is int and doc['schemaVersion'] == 1 and doc['hashAlgorithm'] == 'sha256-lowercase-hex'
          names = records(doc['layers'], {'name', 'layerWire', 'globalLayerHash'})
          for layer in doc['layers']:
              assert isinstance(layer['layerWire'], str)
              body = layer['layerWire'].encode('utf-8')
              assert 0 < len(body) <= 8192 and hashlib.sha256(body).hexdigest() == layer['globalLayerHash']
          codes = {'ok', 'configuration_invalid', 'configuration_field_locked', 'configuration_conflict'}
          def refs(value, required=True):
              assert isinstance(value, list) and int(required) <= len(value) <= 20
              assert all(isinstance(name, str) and name in names for name in value) and len(value) == len(set(value))
          def outcome(case):
              assert case['expectedCode'] in codes and isinstance(case['effectiveWire'], str)
              assert bool(case['effectiveWire']) == (case['expectedCode'] == 'ok')
              if case['expectedCode'] == 'ok':
                  effective = parse(case['effectiveWire'])
                  assert set(effective) == {'document', 'fields', 'restrictions'}
                  assert isinstance(effective['document'], dict) and isinstance(effective['fields'], dict) and isinstance(effective['restrictions'], list)
          records(doc['projections'], {'name', 'layerNames', 'expectedCode', 'effectiveWire'}, 41)
          for case in doc['projections']:
              refs(case['layerNames'])
              outcome(case)
          records(doc['rebases'], {'name', 'baseLayerNames', 'localLayerNames', 'remoteLayerNames', 'chosenLayerNames', 'resolution', 'expectedCode', 'effectiveWire'}, 11)
          for case in doc['rebases']:
              for key in ('baseLayerNames', 'localLayerNames', 'remoteLayerNames'):
                  refs(case[key])
              assert case['resolution'] in ('merged', 'conflict')
              refs(case['chosenLayerNames'], case['resolution'] == 'merged')
              if case['resolution'] == 'conflict':
                  assert not case['chosenLayerNames'] and case['expectedCode'] == 'configuration_conflict'
              outcome(case)
          records(doc['bounds'], {'name', 'generator', 'groups', 'leavesPerGroup', 'extraLeaves', 'globalLayerHash', 'expectedCode', 'expectedFieldCount'}, 2)
          for index, case in enumerate(doc['bounds']):
              assert all(type(case[key]) is int for key in ('groups', 'leavesPerGroup', 'extraLeaves', 'expectedFieldCount'))
              assert (case['name'], case['generator'], case['groups'], case['leavesPerGroup'], case['extraLeaves']) == ('leaves-' + str(4096 + index), 'leaf-grid-v1', 64, 64, index)
              assert (case['expectedCode'], case['expectedFieldCount']) == (('ok', 4096) if index == 0 else ('configuration_invalid', 0))
              assert isinstance(case['globalLayerHash'], str) and len(case['globalLayerHash']) == 64 and all(ch in '0123456789abcdef' for ch in case['globalLayerHash'])
          print('Bounded synthetic Go projection artifact and exact layer hashes verified')
          PY
          git rev-parse HEAD > dist/layer-projection/SOURCE.txt
          (cd dist/layer-projection && sha256sum projection-fixture.json SOURCE.txt > SHA256SUMS)
          python3 tools/check_public_data.py dist/layer-projection
          bash tools/scan_secrets.sh dist/layer-projection
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.layer-projection-scan.outcome == 'success'
        with:
          name: layer-projection-evidence
          path: |
            dist/layer-projection/projection-fixture.json
            dist/layer-projection/SOURCE.txt
            dist/layer-projection/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Validate temporary Go operation specimens and scan their public metadata report
        id: layer-operation-scan
        env:
          SYN443_OPERATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$SYN443_OPERATION_SOURCE_SHA"
          mkdir -p dist/layer-operation
          SYN443_OPERATION_FIXTURE="$(mktemp "${RUNNER_TEMP:?}/syn443-operation-fixture.XXXXXXXX.json")"
          export SYN443_OPERATION_FIXTURE
          readonly SYN443_OPERATION_FIXTURE
          cleanup_operation_fixture() {
            rm -f -- "$SYN443_OPERATION_FIXTURE"
          }
          trap cleanup_operation_fixture EXIT
          go run ./cmd/layer-fixture --operations > "$SYN443_OPERATION_FIXTURE"
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          def closed_object(pairs):
              value = {}
              for key, item in pairs:
                  assert key not in value, 'Duplicate operation artifact field'
                  value[key] = item
              return value
          def parse(raw):
              return json.loads(raw, object_pairs_hook=closed_object, parse_constant=lambda _: (_ for _ in ()).throw(ValueError('Non-finite fixture value')))
          def digest(raw):
              return hashlib.sha256(raw).hexdigest()
          def opaque(raw):
              return base64.urlsafe_b64encode(hashlib.sha256(raw).digest()).decode('ascii').rstrip('=')
          def decoded(raw):
              assert isinstance(raw, str) and re.fullmatch(r'[A-Za-z0-9_-]+', raw), 'Non-rawurl fixture bytes'
              value = base64.b64decode(raw + '=' * (-len(raw) % 4), altchars=b'-_', validate=True)
              assert base64.urlsafe_b64encode(value).decode('ascii').rstrip('=') == raw, 'Noncanonical original bytes'
              return value
          specimen = Path(os.environ['SYN443_OPERATION_FIXTURE'])
          runner_temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert specimen.parent.resolve(strict=True) == runner_temp and specimen.name.startswith('syn443-operation-fixture.') and specimen.name.endswith('.json')
          assert specimen.is_file() and not specimen.is_symlink() and 0 < specimen.stat().st_size <= 65536, 'Temporary operation specimen byte bound'
          raw = specimen.read_bytes()
          assert 0 < len(raw) <= 65536, 'Temporary operation specimen byte bound'
          doc = parse(raw.decode('utf-8'))
          assert isinstance(doc, dict) and set(doc) == {'schemaVersion', 'syntheticOnly', 'nowMs', 'actor', 'apiOrigin', 'proposalWire', 'previewKeyId', 'previewRootSpkiB64', 'originals'}
          assert type(doc['schemaVersion']) is int and doc['schemaVersion'] == 1 and doc['syntheticOnly'] is True
          assert type(doc['nowMs']) is int and doc['nowMs'] == 1800000000000
          assert doc['apiOrigin'] == 'https://control.example.invalid' and doc['previewKeyId'] == 'synthetic-operation-root'
          assert doc['actor'] == opaque(b'https://identity.example.invalid/realms/fixture\x00synthetic-admin')
          public_der = base64.b64decode(doc['previewRootSpkiB64'], validate=True)
          assert len(public_der) == 91 and base64.b64encode(public_der).decode('ascii') == doc['previewRootSpkiB64'], 'Bounded canonical public P256 SPKI'
          assert isinstance(doc['proposalWire'], str) and isinstance(parse(doc['proposalWire']), dict)
          expected = [name + '-v' + str(version) for version in (1, 2) for name in ('draft-put', 'draft-discard', 'preview', 'publish')]
          assert isinstance(doc['originals'], list) and len(doc['originals']) == 8
          total = 0
          action_names = {'draft-put': 'configuration.layers.draft.put', 'draft-discard': 'configuration.layers.draft.discard', 'preview': 'configuration.preview.request', 'publish': 'configuration.publish'}
          for index, case in enumerate(doc['originals']):
              assert isinstance(case, dict) and set(case) == {'name', 'originalBody64', 'bodyHash', 'jobId', 'lookupWire', 'sealWire', 'outcomes'}
              assert case['name'] == expected[index]
              version = 1 if index < 4 else 2
              name = ('draft-put', 'draft-discard', 'preview', 'publish')[index % 4]
              original_raw = decoded(case['originalBody64'])
              assert 0 < len(original_raw) <= 262144 and digest(original_raw) == case['bodyHash']
              original = parse(original_raw.decode('utf-8'))
              assert isinstance(original, dict) and set(original) == {'version', 'action', 'requestId', 'payload'}
              assert type(original['version']) is int and original['version'] == version and original['action'] == action_names[name]
              assert original['requestId'] == opaque(('synthetic-operation/v' + str(version) + '/' + name).encode('ascii'))
              is_job = name in ('preview', 'publish')
              job_id = opaque((doc['actor'] + '\x00' + original['requestId']).encode('ascii')) if is_job else ''
              assert case['jobId'] == job_id
              for key, intent in (('lookupWire', 'lookup'), ('sealWire', 'seal_if_absent')):
                  reconcile = parse(case[key])
                  assert isinstance(reconcile, dict) and set(reconcile) == {'version', 'requestId', 'intent', 'originalBody64'}
                  assert type(reconcile['version']) is int and reconcile['version'] == 1 and reconcile['intent'] == intent and reconcile['originalBody64'] == case['originalBody64']
                  assert reconcile['requestId'] == opaque(('synthetic-reconcile/' + case['name'] + '/' + intent).encode('ascii'))
              outcome_names = ['UNKNOWN', 'RECORDED', 'RECORDED_RESULT_UNAVAILABLE']
              if version == 2:
                  outcome_names.append('NO_EFFECT')
              if is_job:
                  outcome_names += ['RECORDED_RUNNING', 'RECORDED_READY' if name == 'preview' else 'RECORDED_PUBLISHED']
              assert isinstance(case['outcomes'], list) and len(case['outcomes']) == len(outcome_names)
              for outcome_index, entry in enumerate(case['outcomes']):
                  assert isinstance(entry, dict) and set(entry) == {'name', 'wire'} and entry['name'] == outcome_names[outcome_index]
                  value = parse(entry['wire'])
                  fields = {'version', 'actor', 'action', 'requestId', 'bodyHash', 'targetKind', 'targetId', 'outcome', 'recordedAtMs', 'effectKind', 'effectId', 'effectRevision'}
                  assert isinstance(value, dict) and set(value) in (fields, fields | {'job'})
                  assert type(value['version']) is int and value['version'] == 1
                  assert (value['actor'], value['action'], value['requestId'], value['bodyHash']) == (doc['actor'], original['action'], original['requestId'], case['bodyHash'])
                  assert (value['targetKind'], value['targetId']) == ('device', 'synthetic-device')
                  label = entry['name']
                  assert value['outcome'] == (label if label in ('UNKNOWN', 'NO_EFFECT', 'RECORDED_RESULT_UNAVAILABLE') else 'RECORDED')
                  assert type(value['recordedAtMs']) is int and value['recordedAtMs'] == (0 if label == 'UNKNOWN' else doc['nowMs'] + 1)
                  assert type(value['effectRevision']) is int
                  if label in ('UNKNOWN', 'NO_EFFECT'):
                      assert (value['effectKind'], value['effectId'], value['effectRevision']) == ('', '', 0) and 'job' not in value
                  else:
                      assert (value['effectKind'], value['effectId'], value['effectRevision']) == (('job', job_id, 0) if is_job else ('draft', 'synthetic-operation-draft', 1))
                      has_job = is_job and label != 'RECORDED_RESULT_UNAVAILABLE'
                      assert ('job' in value) == has_job
                      if has_job:
                          job = value['job']
                          terminal = label in ('RECORDED_READY', 'RECORDED_PUBLISHED')
                          assert isinstance(job, dict) and set(job) == ({'id', 'state', 'result'} if terminal else {'id', 'state'})
                          assert job['id'] == job_id and job['state'] == {'RECORDED': 'queued', 'RECORDED_RUNNING': 'running', 'RECORDED_READY': 'ready', 'RECORDED_PUBLISHED': 'published'}[label]
                  total += 1
          assert total == 36, 'Operation outcome matrix changed'
          source = os.environ['SYN443_OPERATION_SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'Exact GitHub event-source commit required'
          report = {'sourceCommit': source, 'producerTests': 19, 'originals': 8, 'outcomes': total,
                    'fixtureBytes': len(raw), 'fixtureSHA256': digest(raw), 'syntheticOnly': True, 'specimensPublished': False}
          safe = json.dumps(report, sort_keys=True, separators=(',', ':'), allow_nan=False).encode('ascii') + b'\n'
          assert 0 < len(safe) <= 4096
          public = parse(safe.decode('ascii'))
          assert isinstance(public, dict) and set(public) == {'sourceCommit', 'producerTests', 'originals', 'outcomes', 'fixtureBytes', 'fixtureSHA256', 'syntheticOnly', 'specimensPublished'}
          assert public['sourceCommit'] == source and re.fullmatch(r'[0-9a-f]{64}', public['fixtureSHA256'])
          assert all(type(public[key]) is int for key in ('producerTests', 'originals', 'outcomes', 'fixtureBytes'))
          assert (public['producerTests'], public['originals'], public['outcomes']) == (19, 8, 36) and 0 < public['fixtureBytes'] <= 65536
          assert public['syntheticOnly'] is True and public['specimensPublished'] is False
          Path('dist/layer-operation/operation-wire-report.json').write_bytes(safe)
          print('Bounded synthetic actual Go operation wire: 8 originals, 36 outcomes, exact hashes and job identities')
          PY
          cleanup_operation_fixture
          test ! -e "$SYN443_OPERATION_FIXTURE"
          printf '%s\n' "$SYN443_OPERATION_SOURCE_SHA" > dist/layer-operation/SOURCE.txt
          (cd dist/layer-operation && sha256sum operation-wire-report.json SOURCE.txt > SHA256SUMS)
          python3 - <<'PY'
          import os
          from pathlib import Path
          public = Path('dist/layer-operation')
          assert public.is_dir() and not public.is_symlink()
          entries = list(public.iterdir())
          assert {path.name for path in entries} == {'operation-wire-report.json', 'SOURCE.txt', 'SHA256SUMS'} and len(entries) == 3
          assert all(path.is_file() and not path.is_symlink() for path in entries), 'Only three regular public evidence files'
          assert (public / 'SOURCE.txt').read_text(encoding='ascii') == os.environ['SYN443_OPERATION_SOURCE_SHA'] + '\n'
          assert not Path(os.environ['SYN443_OPERATION_FIXTURE']).exists(), 'Temporary signed specimen must be removed before scanning/upload'
          PY
          python3 tools/check_public_data.py dist/layer-operation
          bash tools/scan_secrets.sh dist/layer-operation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.layer-operation-scan.outcome == 'success'
        with:
          name: layer-operation-evidence
          path: |
            dist/layer-operation/operation-wire-report.json
            dist/layer-operation/SOURCE.txt
            dist/layer-operation/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - run: go build -o bin/syn443-api ./cmd/api
      - run: python3 tools/smoke_api.py bin/syn443-api
      - run: go build -o bin/syn443-policy-sign ./cmd/policy-sign && go build -o bin/syn443-policy-serve ./cmd/policy-serve
      - run: python3 tools/smoke_policy.py bin/syn443-policy-serve bin/syn443-policy-sign
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build control-plane runtime artifacts
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/control-plane
          for binary in enrollment-api enrollment-worker enrollment-admin support-chat-web resource-inspect control-api source-worker overlay-worker telemetry-ingest; do
            go build -trimpath -ldflags='-s -w -buildid=' -o "dist/control-plane/$binary" "./cmd/$binary"
          done
          git rev-parse HEAD > dist/control-plane/SOURCE.txt
          (cd dist/control-plane && sha256sum enrollment-api enrollment-worker enrollment-admin support-chat-web resource-inspect control-api source-worker overlay-worker telemetry-ingest > SHA256SUMS)
      - name: Scan control-plane runtime payloads
        id: runtime-scan
        run: |
          python3 tools/check_compiled_url_shapes.py dist/control-plane
          python3 tools/check_public_data.py dist/control-plane
          bash tools/scan_secrets.sh dist/control-plane
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.runtime-scan.outcome == 'success'
        with:
          name: control-plane-linux-amd64
          path: dist/control-plane/
          if-no-files-found: error
          retention-days: 14
      - name: Build and scan the separate temporary LAN fixture
        id: route-fixture-scan
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/route-fixture
          go build -trimpath -ldflags='-s -w -buildid=' -o dist/route-fixture/route-fixture ./cmd/route-fixture
          git rev-parse HEAD > dist/route-fixture/SOURCE.txt
          (cd dist/route-fixture && sha256sum route-fixture > SHA256SUMS)
          python3 tools/check_compiled_url_shapes.py dist/route-fixture
          python3 tools/check_public_data.py dist/route-fixture
          bash tools/scan_secrets.sh dist/route-fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.route-fixture-scan.outcome == 'success'
        with:
          name: route-fixture-linux-amd64
          path: dist/route-fixture/
          if-no-files-found: error
          retention-days: 14
      - name: Build and scan the separate configuration publication worker
        # Keep the existing eight-binary runtime manifest unchanged.
        id: configuration-worker-scan
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/configuration-worker
          go build -trimpath -ldflags='-s -w -buildid=' -o dist/configuration-worker/configuration-worker ./cmd/configuration-worker
          git rev-parse HEAD > dist/configuration-worker/SOURCE.txt
          (cd dist/configuration-worker && sha256sum configuration-worker > SHA256SUMS)
          python3 tools/check_compiled_url_shapes.py dist/configuration-worker
          python3 tools/check_public_data.py dist/configuration-worker
          bash tools/scan_secrets.sh dist/configuration-worker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.configuration-worker-scan.outcome == 'success'
        with:
          name: configuration-worker-linux-amd64
          path: dist/configuration-worker/
          if-no-files-found: error
          retention-days: 14
      - name: Verify and scan the bundled console assets
        run: |
          test -s internal/chatweb/assets/control/ui/console.js
          test -s internal/chatweb/assets/control/ui/console.css
          python3 tools/check_public_data.py internal/chatweb/assets/control/ui
          bash tools/scan_secrets.sh internal/chatweb/assets/control/ui
          mkdir -p dist/console-ui
          cp internal/chatweb/assets/control/ui/* dist/console-ui/
          git rev-parse HEAD > dist/console-ui/SOURCE.txt
          (cd dist/console-ui && sha256sum -- *.js *.css *.woff2 *.svg > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-console-ui
          path: dist/console-ui/
          if-no-files-found: error
          retention-days: 14
      - name: Workflow validation
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Dependency inventory
        run: go list -m -json all > dependency-inventory.json
      - name: Scan evidence payloads
        id: evidence-scan
        if: always()
        run: |
          for evidence in exit-country-core-tests.jsonl adaptive-catalogue-tests.jsonl service-discovery-ordinary-tests.jsonl; do
            if test -f "$evidence"; then
              test -s "$evidence"
              python3 tools/check_public_data.py "$evidence"
              bash tools/scan_secrets.sh "$evidence"
            fi
          done
          test -s coverage.out && test -s dependency-inventory.json
          python3 tools/check_public_data.py coverage.out dependency-inventory.json
          bash tools/scan_secrets.sh coverage.out dependency-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence-upload
        if: always() && steps.evidence-scan.outcome == 'success'
        with:
          name: control-plane-test-evidence
          path: |
            coverage.out
            exit-country-core-tests.jsonl
            adaptive-catalogue-tests.jsonl
            service-discovery-ordinary-tests.jsonl
            dependency-inventory.json
          retention-days: 14
  catalog:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: true
      - run: bash -n tools/test_catalog.sh
      - name: Run complete catalog race suite with adaptive actual outcomes
        run: |
          set -euo pipefail
          GOFLAGS=-json bash tools/test_catalog.sh | tee adaptive-catalog-postgres-tests.jsonl
          jq -es 'any(.[]; .Package == "github.com/nd4y/syn443-control-plane/internal/catalog" and .Test == "TestSQLResourcesAuthorityImpactAndRevisionFence" and .Action == "pass")' adaptive-catalog-postgres-tests.jsonl
          jq -es 'any(.[]; .Package == "github.com/nd4y/syn443-control-plane/internal/catalog" and .Action == "pass" and .Test == "TestSQLResourceInspectionKeepsFutureProvidersInactiveAndScoped")' adaptive-catalog-postgres-tests.jsonl
          python3 tools/check_adaptive_runtime_evidence.py adaptive-catalog-postgres-tests.jsonl --stage catalog
          python3 tools/check_operation_reconcile_evidence.py adaptive-catalog-postgres-tests.jsonl --stage catalog
          python3 tools/check_operation_version_evidence.py adaptive-catalog-postgres-tests.jsonl --stage catalog
      - run: python3 tools/check_catalog_coverage.py
      - name: Scan catalog evidence
        id: catalog-scan
        if: always()
        run: |
          test -s catalog-coverage.out
          python3 tools/check_public_data.py catalog-coverage.out adaptive-catalog-postgres-tests.jsonl adaptive-catalog-postgres-tests.jsonl
          bash tools/scan_secrets.sh catalog-coverage.out adaptive-catalog-postgres-tests.jsonl adaptive-catalog-postgres-tests.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.catalog-scan.outcome == 'success'
        with:
          name: catalog-test-evidence
          path: |
            catalog-coverage.out
            adaptive-catalog-postgres-tests.jsonl
          retention-days: 14
  keycloak:
