title = "SYN443 public source"
[extend]
useDefault = true

# This exact value is the public OpenAPI file SHA-256, not an API credential.
# Keep the default detector and constrain the exception to one field/value/path.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Reviewed public OpenAPI content digest"
condition = "AND"
paths = ['''^contracts/lock\.json$''']
regexTarget = "line"
regexes = ['''^\s*"openapi\.json": "9a6327cdc04b5d1b91b85a3c600ffa90fe4ece339179230793190f5bdf650359",?\s*$''']

[[rules.allowlists]]
description = "Reviewed public M1 delivery OpenAPI content digest"
condition = "AND"
paths = ['''^contracts/lock\.json$''']
regexTarget = "line"
regexes = ['''^\s*"policy-openapi\.json": "11a4f22cf7ce3a8391499e7fcdbd8ff6ab7e1b5743167377ee236b13d9470c28",?\s*$''']

[[rules.allowlists]]
description = "Reviewed public M2 enrollment OpenAPI content digest"
condition = "AND"
paths = ['''^contracts/lock\.json$''']
regexTarget = "line"
regexes = ['''^\s*"enrollment-openapi\.json": "f54887f5b48faf9447274b7283e1ed8baeed4ee3d620c6b922d291b7009df5d5",?\s*$''']

[[rules.allowlists]]
description = "Reviewed public M2 owner-cleanup OpenAPI content digest"
condition = "AND"
paths = ['''^contracts/lock\.json$''']
regexTarget = "line"
regexes = ['''^\s*"enrollment-openapi\.json": "54f1c5bce2af819f68531417a654c175e53f60acde38a546d175f834411f9527",?\s*$''']

[[rules.allowlists]]
description = "Reviewed public M2 key-bound OpenAPI content digest"
condition = "AND"
paths = ['''^contracts/lock\.json$''']
regexTarget = "line"
regexes = ['''^\s*"enrollment-openapi\.json": "2b2c5cd3b2491c8c81985f27cf999e78a1fe71984837778f2e48f4fcff3c9056",?\s*$''']

# Public RFC7638 digest, independently derived from deviceSpkiHex by Go/Kotlin tests.
# Keep recursive hex decoding enabled; only this exact synthetic digest/path is exempt.
[[rules.allowlists]]
description = "Reviewed public device thumbprint in synthetic signature evidence"
condition = "AND"
paths = ['''^contracts/v1/policy-device-signature\.json$''']
regexTarget = "secret"
regexes = ['''^slcBR6U\-6TWXIkqTYwlBfYO18sfH8S3E4_em\-n_l2ng$''']

[[rules.allowlists]]
description = "Reviewed public support chat OpenAPI content digest"
condition = "AND"
paths = ['''^contracts/lock\.json$''']
regexTarget = "line"
regexes = ['''^\s*"chat-openapi\.json": "505800fd34c456c86c31345ec18b20be5009e233b1e69f4d637c6688b9b5e3ed",?\s*$''']
