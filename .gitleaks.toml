title = "SYN443 public source"
[extend]
useDefault = true

# This exact value is the public OpenAPI file SHA-256, not an API credential.
# Keep the default detector and constrain the exception to one field/value/path.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Reviewed SHA-256 of the public exit-check OpenAPI contract"
condition = "AND"
paths = ['''^contracts/lock\.json$''']
regexTarget = "line"
regexes = ['''^\s*"control-openapi\.json": "b12be5795d3c05d6ccbcd26acc2579a38a3354390bfc914a6b9f54bce376c73a",?\s*$''']
[[rules.allowlists]]
description = "Reviewed SHA-256 of public reserve probe cooldown contracts"
condition = "AND"
paths = ['''^contracts/lock\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"policy-payload\.schema\.json": "5b637dc08abe9463e5d58ff111785eccafdb071144103570a456b88dcae547a2",?\s*$''',
  '''^\s*"control-openapi\.json": "f85d000d2fb9ee5dbadf6e1e68ca13b94ebddbb9e1abf0bad5b0545fcf631235",?\s*$''',
  '''^\s*"control-openapi\.json": "bd404f7eb482ce09508e0d252017f2c53174e7695a25a51971ada21ba074e4d7",?\s*$''',
]

