# Public RFC7638 digest, independently derived from deviceSpkiHex by Go/Kotlin tests.
# Keep recursive hex decoding enabled; only this exact synthetic digest/path is exempt.
[[rules.allowlists]]
description = "Reviewed public device thumbprint in synthetic signature evidence"
condition = "AND"
paths = ['''^contracts/v1/policy-device-signature\.json$''']
regexTarget = "secret"
regexes = ['''^slcBR6U\-6TWXIkqTYwlBfYO18sfH8S3E4_em\-n_l2ng$''']

