<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYN443 - Чат поддержки</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><div><strong>SYN443</strong><h1>Чат поддержки</h1></div><nav><button id="login">Войти через Keycloak</button><button id="logout" disabled>Выйти</button></nav></header>
<p id="status" role="status">Для работы войдите в учётную запись администратора.</p>
<main><aside aria-label="Диалоги"><h2>Диалоги</h2><ul id="inbox"></ul><button id="more" disabled>Ещё диалоги</button></aside>
<section aria-labelledby="thread-title"><h2 id="thread-title">Выберите диалог</h2><button id="older" disabled>Предыдущие сообщения</button><ol id="messages" aria-live="polite" aria-label="Сообщения"></ol>
<form id="compose"><label for="text">Сообщение</label><textarea id="text" rows="3" maxlength="8192" disabled></textarea><label for="file">Файлы до 25 МБ каждый, до 4 файлов</label><input id="file" type="file" multiple disabled><p id="attachment"></p><progress id="progress" max="100" value="0" hidden></progress><button id="send" disabled>Отправить</button><button id="discard" type="button" disabled>Удалить локальную попытку</button></form>
<p class="notice">Сообщения и файлы хранятся на сервере и доступны администраторам сервиса. Веб-интерфейс отправляет исходные файлы; фото и видео сжимаются в Android-приложении.</p></section></main></body></html>
